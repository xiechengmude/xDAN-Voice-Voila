<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xDAN Hermes 智能语音助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #7e22ce;
            --primary-light: #a855f7;
            --primary-dark: #6b21a8;
            --secondary-color: #f0f4f8;
            --text-color: #333;
            --light-text: #666;
            --border-radius: 16px;
            --message-radius: 18px;
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            max-width: 1200px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }
        
        .header {
            padding: 15px 20px;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-logo {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .brand-name {
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
        }
        
        .settings-btn {
            background: none;
            border: none;
            color: var(--light-text);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .settings-btn:hover {
            color: var(--primary-color);
        }
        
        .main-content {
            display: flex;
            height: calc(100vh - 70px);
        }
        
        .sidebar {
            width: 300px;
            background-color: #f9fafb;
            border-right: 1px solid #eaeaea;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .voice-selector {
            margin-bottom: 20px;
        }
        
        .voice-selector select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }
        
        .voice-upload {
            margin-bottom: 20px;
        }
        
        .visualizer-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .visualizer {
            width: 100%;
            height: 120px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            max-width: 80%;
        }
        
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .ai-message {
            align-self: flex-start;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
        }
        
        .user-avatar {
            background-color: var(--primary-light);
            color: white;
        }
        
        .ai-avatar {
            background-color: var(--primary-color);
            color: white;
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: var(--message-radius);
            position: relative;
        }
        
        .user-content {
            background-color: var(--primary-light);
            color: white;
            border-top-right-radius: 4px;
        }
        
        .ai-content {
            background-color: var(--secondary-color);
            border-top-left-radius: 4px;
        }
        
        .message-time {
            font-size: 12px;
            color: var(--light-text);
            margin-top: 5px;
            text-align: right;
        }
        
        .chat-controls {
            padding: 15px 20px;
            border-top: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
        }
        
        .record-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .record-btn:hover {
            background-color: var(--primary-dark);
        }
        
        .record-btn.recording {
            background-color: #dc2626;
            animation: pulse 1.5s infinite;
        }
        
        .status-text {
            flex-grow: 1;
            color: var(--light-text);
            font-size: 14px;
        }
        
        .settings-panel {
            position: absolute;
            top: 70px;
            right: 0;
            width: 300px;
            background-color: white;
            border-left: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            padding: 20px;
            z-index: 100;
            transform: translateX(100%);
            transition: var(--transition);
            height: calc(100vh - 70px);
            overflow-y: auto;
        }
        
        .settings-panel.active {
            transform: translateX(0);
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-settings {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--light-text);
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="brand">
                <div class="brand-logo">H</div>
                <div class="brand-name">xDAN Hermes</div>
            </div>
            <button class="settings-btn" id="settingsBtn">
                <i class="bi bi-gear"></i>
            </button>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="voice-selector">
                    <h5>选择 AI 声音</h5>
                    <select id="voiceSelect" class="form-select">
                        <option value="Homer Simpson">Homer Simpson</option>
                        <option value="Mark Zuckerberg">Mark Zuckerberg</option>
                        <option value="Elon Musk">Elon Musk</option>
                        <option value="Samantha">Samantha</option>
                        <option value="Custom">自定义声音</option>
                    </select>
                </div>
                
                <div class="voice-upload" id="voiceUploadContainer" style="display: none;">
                    <h5>上传自定义声音</h5>
                    <input type="file" id="voiceUpload" class="form-control" accept="audio/*">
                    <button id="uploadVoiceButton" class="btn btn-primary mt-2 w-100">上传声音</button>
                </div>
                
                <div class="visualizer-container">
                    <h5>音频可视化</h5>
                    <div class="visualizer">
                        <canvas id="visualizer"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="messages">
                    <div class="message ai-message">
                        <div class="message-avatar ai-avatar">AI</div>
                        <div>
                            <div class="message-content ai-content">
                                您好！我是 xDAN Hermes 智能语音助手，点击下方麦克风按钮开始与我对话。
                            </div>
                            <div class="message-time">刚刚</div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-controls">
                    <button id="recordButton" class="record-btn">
                        <i class="bi bi-mic"></i>
                    </button>
                    <div class="status-text" id="status">准备就绪，点击麦克风开始对话</div>
                </div>
            </div>
            
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-header">
                    <h5>设置</h5>
                    <button class="close-settings" id="closeSettings">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">语音识别灵敏度</label>
                    <input type="range" class="form-range" id="sensitivityRange" min="0" max="100" value="50">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">AI 响应速度</label>
                    <select class="form-select" id="responseSpeed">
                        <option value="fast">快速</option>
                        <option value="normal" selected>正常</option>
                        <option value="slow">慢速</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">主题颜色</label>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm" style="background-color: #7e22ce; width: 30px; height: 30px; border-radius: 50%;" data-color="#7e22ce"></button>
                        <button class="btn btn-sm" style="background-color: #2563eb; width: 30px; height: 30px; border-radius: 50%;" data-color="#2563eb"></button>
                        <button class="btn btn-sm" style="background-color: #16a34a; width: 30px; height: 30px; border-radius: 50%;" data-color="#16a34a"></button>
                        <button class="btn btn-sm" style="background-color: #dc2626; width: 30px; height: 30px; border-radius: 50%;" data-color="#dc2626"></button>
                    </div>
                </div>
                
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                    <label class="form-check-label" for="darkModeSwitch">深色模式</label>
                </div>
                
                <button class="btn btn-primary w-100 mb-3">保存设置</button>
                <button class="btn btn-outline-secondary w-100">重置设置</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let websocket;
        let mediaRecorder;
        let audioContext;
        let analyser;
        let visualizerCanvas;
        let canvasContext;
        let isRecording = false;
        let audioChunks = [];
        let sessionId = null;
        
        // DOM 元素
        const recordButton = document.getElementById('recordButton');
        const statusElement = document.getElementById('status');
        const messagesContainer = document.getElementById('messages');
        const voiceSelect = document.getElementById('voiceSelect');
        const voiceUploadContainer = document.getElementById('voiceUploadContainer');
        const voiceUpload = document.getElementById('voiceUpload');
        const uploadVoiceButton = document.getElementById('uploadVoiceButton');
        const visualizer = document.getElementById('visualizer');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettings = document.getElementById('closeSettings');
        
        // 初始化函数
        function init() {
            // 初始化可视化器
            setupVisualizer();
            
            // 创建会话
            createSession();
            
            // 事件监听器
            recordButton.addEventListener('click', toggleRecording);
            voiceSelect.addEventListener('change', handleVoiceChange);
            uploadVoiceButton.addEventListener('click', uploadCustomVoice);
            settingsBtn.addEventListener('click', toggleSettings);
            closeSettings.addEventListener('click', toggleSettings);
            
            // 响应式调整
            window.addEventListener('resize', () => {
                if (visualizerCanvas) {
                    visualizerCanvas.width = visualizer.clientWidth;
                    visualizerCanvas.height = visualizer.clientHeight;
                }
            });
        }
        
        // 创建会话
        async function createSession() {
            try {
                const response = await fetch('/api/session/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        instruction: "你是一个友好的AI助手，能够用自然的方式与用户交流。",
                        voice_name: voiceSelect.value
                    })
                });
                
                const data = await response.json();
                sessionId = data.session_id;
                
                // 连接 WebSocket
                connectWebSocket();
                
                statusElement.textContent = "会话已创建，可以开始对话";
            } catch (error) {
                console.error('创建会话失败:', error);
                statusElement.textContent = "创建会话失败，请刷新页面重试";
            }
        }
        
        // 连接 WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${sessionId}`;
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function(e) {
                console.log("WebSocket 连接已建立");
            };
            
            websocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log("收到消息:", data);
                
                if (data.type === "welcome") {
                    console.log("收到欢迎消息");
                } else if (data.type === "response") {
                    // 添加 AI 消息到聊天
                    addMessage(data.data.text, "ai");
                    
                    // 播放音频响应
                    if (data.data.audio_base64) {
                        playAudioResponse(data.data.audio_base64);
                    }
                } else if (data.type === "info") {
                    statusElement.textContent = data.message;
                }
            };
            
            websocket.onclose = function(event) {
                if (event.wasClean) {
                    console.log(`WebSocket 连接已关闭，代码=${event.code} 原因=${event.reason}`);
                } else {
                    console.error('WebSocket 连接中断');
                    statusElement.textContent = "连接已断开，请刷新页面重试";
                }
            };
            
            websocket.onerror = function(error) {
                console.error(`WebSocket 错误: ${error}`);
                statusElement.textContent = "连接错误，请刷新页面重试";
            };
        }
        
        // 切换录音状态
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        // 开始录音
        async function startRecording() {
            try {
                // 显示正在请求权限的状态
                statusElement.textContent = "正在请求麦克风权限...";
                
                // 请求麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 设置音频上下文和分析器
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                }
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                // 开始可视化
                visualize();
                
                // 创建媒体记录器
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = function(event) {
                    audioChunks.push(event.data);
                    
                    // 实时发送音频数据到服务器
                    if (audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        processAudioData(audioBlob);
                        audioChunks = [];
                    }
                };
                
                mediaRecorder.start(100); // 每100ms触发一次ondataavailable事件
                
                isRecording = true;
                recordButton.classList.add('recording');
                recordButton.innerHTML = '<i class="bi bi-stop-fill"></i>';
                statusElement.textContent = "正在录音...";
                
                // 添加用户消息占位符
                addMessage("正在聆听您的声音...", "user", true);
                
            } catch (error) {
                console.error('无法访问麦克风:', error);
                
                // 显示更友好的错误提示
                let errorMessage = "无法访问麦克风";
                
                if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
                    errorMessage = "麦克风权限被拒绝。请点击浏览器地址栏中的锁图标，允许麦克风访问。";
                    
                    // 添加一个指导消息
                    addMessage("看起来浏览器阻止了麦克风访问。请点击地址栏中的锁图标，然后允许麦克风访问。完成后再次点击麦克风按钮。", "ai");
                    
                } else if (error.name === "NotFoundError") {
                    errorMessage = "未检测到麦克风设备。请确保您的麦克风已正确连接。";
                } else if (error.name === "SecurityError") {
                    errorMessage = "由于安全限制，无法访问麦克风。请使用 HTTPS 或 localhost 访问。";
                }
                
                statusElement.textContent = errorMessage;
            }
        }
        
        // 停止录音
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                isRecording = false;
                recordButton.classList.remove('recording');
                recordButton.innerHTML = '<i class="bi bi-mic"></i>';
                statusElement.textContent = "录音已停止";
                
                // 移除占位符消息
                const placeholder = document.querySelector('.message.user-message.placeholder');
                if (placeholder) {
                    placeholder.remove();
                }
            }
        }
        
        // 处理音频数据
        async function processAudioData(blob) {
            try {
                // 转换为 base64
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = async function() {
                    const base64data = reader.result.split(',')[1];
                    
                    // 通过 WebSocket 发送音频数据
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        const audioArray = await blobToArray(blob);
                        websocket.send(JSON.stringify({
                            type: "audio",
                            data: Array.from(new Float32Array(audioArray))
                        }));
                    }
                };
            } catch (error) {
                console.error('处理音频数据失败:', error);
            }
        }
        
        // Blob 转换为 ArrayBuffer
        function blobToArray(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });
        }
        
        // 播放音频响应
        function playAudioResponse(audioBase64) {
            const audio = new Audio(`data:audio/wav;base64,${audioBase64}`);
            audio.play().catch(error => {
                console.error('播放音频失败:', error);
            });
        }
        
        // 处理声音选择变化
        function handleVoiceChange() {
            const selectedVoice = voiceSelect.value;
            
            if (selectedVoice === "Custom") {
                voiceUploadContainer.style.display = "block";
            } else {
                voiceUploadContainer.style.display = "none";
                
                // 通过 WebSocket 发送声音更改请求
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: "change_voice",
                        voice_name: selectedVoice
                    }));
                    
                    statusElement.textContent = `正在切换到 ${selectedVoice} 的声音...`;
                }
            }
        }
        
        // 上传自定义声音
        async function uploadCustomVoice() {
            const fileInput = voiceUpload;
            
            if (fileInput.files.length === 0) {
                statusElement.textContent = "请选择一个音频文件";
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('session_id', sessionId);
            formData.append('voice_file', file);
            
            try {
                statusElement.textContent = "正在上传自定义声音...";
                
                const response = await fetch('/api/voice/custom', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusElement.textContent = "自定义声音已设置";
                } else {
                    statusElement.textContent = `上传失败: ${data.detail || '未知错误'}`;
                }
            } catch (error) {
                console.error('上传自定义声音失败:', error);
                statusElement.textContent = "上传失败，请重试";
            }
        }
        
        // 添加消息到聊天界面
        function addMessage(text, sender, isPlaceholder = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            if (isPlaceholder) {
                messageDiv.classList.add('placeholder');
            }
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div>
                        <div class="message-content user-content">
                            ${text}
                        </div>
                        <div class="message-time">${timeString}</div>
                    </div>
                    <div class="message-avatar user-avatar">
                        <i class="bi bi-person"></i>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-avatar ai-avatar">AI</div>
                    <div>
                        <div class="message-content ai-content">
                            ${text}
                        </div>
                        <div class="message-time">${timeString}</div>
                    </div>
                `;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 设置音频可视化
        function setupVisualizer() {
            visualizerCanvas = document.createElement('canvas');
            visualizerCanvas.width = visualizer.clientWidth;
            visualizerCanvas.height = visualizer.clientHeight;
            visualizer.appendChild(visualizerCanvas);
            canvasContext = visualizerCanvas.getContext('2d');
        }
        
        // 可视化音频
        function visualize() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if (!isRecording) return;
                
                requestAnimationFrame(draw);
                
                analyser.getByteFrequencyData(dataArray);
                
                canvasContext.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                
                const barWidth = (visualizerCanvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    
                    canvasContext.fillStyle = `rgb(${barHeight + 100}, 65, 200)`;
                    canvasContext.fillRect(x, visualizerCanvas.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth + 1;
                }
            }
            
            draw();
        }
        
        // 切换设置面板
        function toggleSettings() {
            settingsPanel.classList.toggle('active');
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
